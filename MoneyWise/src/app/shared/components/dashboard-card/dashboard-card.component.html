<ion-card [class]="'card-' + tipo">
  <ion-card-header>
    <ion-icon [name]="icono" [color]="tipo === 'ingreso' ? 'success' : tipo === 'gasto' ? 'danger' : 'primary'"></ion-icon>
    <ion-card-subtitle>{{ titulo }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <h2 [class]="'amount-' + tipo">{{ monto | currencyFormat }}</h2>
  </ion-card-content>
</ion-card>
