<div class="dc-card" [class.dc-saldo]="tipo === 'saldo'" [class.dc-ingreso]="tipo === 'ingreso'" [class.dc-gasto]="tipo === 'gasto'">
  <div class="dc-top">
    <div class="dc-icon-wrap">
      <ion-icon [name]="icono"></ion-icon>
    </div>
    <span class="dc-label">{{ titulo }}</span>
  </div>
  <div class="dc-amount">
    {{ monto | currencyFormat }}
  </div>
</div>
