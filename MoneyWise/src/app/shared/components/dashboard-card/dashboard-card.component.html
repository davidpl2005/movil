<article class="dc-card" [class.dc-saldo]="tipo === 'saldo'" [class.dc-ingreso]="tipo === 'ingreso'" [class.dc-gasto]="tipo === 'gasto'">
  <div class="dc-icon-wrap"><ion-icon [name]="icono"></ion-icon></div>
  <div class="dc-copy">
    <span class="dc-label">{{ titulo }}</span>
    <strong class="dc-amount">{{ monto | currencyFormat }}</strong>
  </div>
</article>
