<div class="progress-item">
  <div class="progress-row">
    <span class="progress-cat">{{ categoria }}</span>
    <span class="progress-values">
      <span class="progress-amount">{{ monto | currencyFormat }}</span>
      <span class="progress-pct">{{ porcentaje | number:'1.0-0' }}%</span>
    </span>
  </div>
  <div class="progress-track">
    <div
      class="progress-fill"
      [style.width.%]="porcentaje"
      [style.background]="color">
    </div>
  </div>
</div>
