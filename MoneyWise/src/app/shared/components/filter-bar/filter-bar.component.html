<div class="filter-bar">

  <ion-segment
    [value]="tipoSeleccionado"
    class="filter-segment"
    (ionChange)="onTipoChange.emit($any($event.detail.value) || 'todos')">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="gasto">
      <ion-label>Gastos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="ingreso">
      <ion-label>Ingresos</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div class="filter-row">
    <ion-item class="filter-cat-item" lines="none">
      <ion-icon name="pricetag-outline" slot="start" class="filter-icon"></ion-icon>
      <ion-select
        [value]="categoriaSeleccionada"
        (ionChange)="onCategoriaChange.emit($any($event.detail.value) || 'todas')"
        interface="popover"
        placeholder="Categoría">
        <ion-select-option value="todas">Todas las categorías</ion-select-option>
        <ion-select-option *ngFor="let cat of categorias" [value]="cat.id">
          {{ cat.nombre }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <ion-searchbar
    class="filter-search"
    placeholder="Buscar por descripción..."
    (ionInput)="onBuscarChange.emit($any($event.detail.value) || '')"
    [debounce]="250">
  </ion-searchbar>

</div>
