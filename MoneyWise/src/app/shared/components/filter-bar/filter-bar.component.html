<section class="filter-bar" aria-label="Filtros de transacciones">
  <ion-searchbar class="filter-search" placeholder="Buscar descripción o categoría" (ionInput)="onBuscarChange.emit($any($event.detail.value) || '')" [debounce]="250"></ion-searchbar>

  <ion-segment [value]="tipoSeleccionado" class="filter-segment" (ionChange)="onTipoChange.emit($any($event.detail.value) || 'todos')">
    <ion-segment-button value="todos"><ion-label>Todos</ion-label></ion-segment-button>
    <ion-segment-button value="gasto"><ion-label>Gastos</ion-label></ion-segment-button>
    <ion-segment-button value="ingreso"><ion-label>Ingresos</ion-label></ion-segment-button>
  </ion-segment>

  <ion-item class="filter-cat-item" lines="none">
    <ion-icon name="pricetag-outline" slot="start" class="filter-icon"></ion-icon>
    <ion-select [value]="categoriaSeleccionada" (ionChange)="onCategoriaChange.emit($any($event.detail.value) || 'todas')" interface="popover" placeholder="Categoría" aria-label="Filtrar por categoría">
      <ion-select-option value="todas">Todas las categorías</ion-select-option>
      <ion-select-option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</ion-select-option>
    </ion-select>
  </ion-item>
</section>
