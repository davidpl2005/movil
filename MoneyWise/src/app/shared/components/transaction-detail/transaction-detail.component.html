<ion-card>
  <ion-card-header>
    <ion-grid>
      <ion-row>
        <ion-col size="12" class="ion-text-center" style="padding: 16px 0 8px;">
          <app-category-icon [categoria]="transaccion.categoria"></app-category-icon>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12" class="ion-text-center">
          <ion-card-title style="margin-bottom: 6px;">
            <app-amount-display [monto]="transaccion.monto" [tipo]="transaccion.tipo" tamano="large"></app-amount-display>
          </ion-card-title>
          <ion-card-subtitle>{{ transaccion.fecha | dateFormat }}</ion-card-subtitle>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-header>
  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-label><strong>Tipo</strong></ion-label>
        <ion-badge slot="end" [color]="transaccion.tipo === 'ingreso' ? 'success' : 'danger'">
          {{ transaccion.tipo | titlecase }}
        </ion-badge>
      </ion-item>
      <ion-item>
        <ion-label><strong>Categoría</strong></ion-label>
        <app-category-badge slot="end" [categoria]="transaccion.categoria"></app-category-badge>
      </ion-item>
      <ion-item *ngIf="transaccion.descripcion">
        <ion-label class="ion-text-wrap"><strong>Descripción</strong><br/>{{ transaccion.descripcion }}</ion-label>
      </ion-item>
      <ion-item *ngIf="transaccion.comprobante" button (click)="onVerComprobante.emit()" detail>
        <ion-label><strong>Comprobante</strong></ion-label>
        <ion-text slot="end" color="primary" style="font-size: 13px; margin-right: 4px;">Ver imagen</ion-text>
        <app-photo-preview slot="end" [src]="transaccion.comprobante" size="small" (onClick)="onVerComprobante.emit()"></app-photo-preview>
      </ion-item>
    </ion-list>
    <div class="action-buttons">
      <ion-button expand="block" fill="outline" (click)="onEdit.emit()">
        <ion-icon slot="start" name="create"></ion-icon>Editar
      </ion-button>
      <ion-button expand="block" fill="outline" color="danger" (click)="onDelete.emit()">
        <ion-icon slot="start" name="trash"></ion-icon>Eliminar
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>
