<div class="detail-card mw-card">

  <!-- Hero monto -->
  <div class="detail-hero">
    <app-category-icon [categoria]="transaccion.categoria" tamano="medium"></app-category-icon>
    <div class="detail-amount">
      <app-amount-display [monto]="transaccion.monto" [tipo]="transaccion.tipo" tamano="large"></app-amount-display>
    </div>
    <p class="detail-date">{{ transaccion.fecha | dateFormat }}</p>

    <div class="detail-badges">
      <span class="mw-badge" [class.mw-badge--ingreso]="transaccion.tipo === 'ingreso'" [class.mw-badge--gasto]="transaccion.tipo === 'gasto'">
        <ion-icon [name]="transaccion.tipo === 'ingreso' ? 'arrow-up-outline' : 'arrow-down-outline'"></ion-icon>
        {{ transaccion.tipo | titlecase }}
      </span>
      <app-category-badge [categoria]="transaccion.categoria"></app-category-badge>
    </div>
  </div>

  <!-- Divisor -->
  <div class="detail-divider"></div>

  <!-- Campos -->
  <div class="detail-fields">

    <div class="detail-field" *ngIf="transaccion.descripcion">
      <span class="field-label">Descripción</span>
      <span class="field-value">{{ transaccion.descripcion }}</span>
    </div>

    <div class="detail-field" *ngIf="transaccion.comprobante">
      <span class="field-label">Comprobante</span>
      <div class="comprobante-wrap" (click)="onVerComprobante.emit()">
        <app-photo-preview [src]="transaccion.comprobante" size="medium" (onClick)="onVerComprobante.emit()"></app-photo-preview>
        <span class="comprobante-link">
          <ion-icon name="expand-outline"></ion-icon>
          Ver imagen
        </span>
      </div>
    </div>

  </div>

  <!-- Acciones -->
  <div class="detail-actions">
    <ion-button expand="block" fill="outline" class="btn-edit" (click)="onEdit.emit()">
      <ion-icon slot="start" name="create-outline"></ion-icon>
      Editar
    </ion-button>
    <ion-button expand="block" fill="outline" class="btn-delete" (click)="onDelete.emit()">
      <ion-icon slot="start" name="trash-outline"></ion-icon>
      Eliminar
    </ion-button>
  </div>

</div>
