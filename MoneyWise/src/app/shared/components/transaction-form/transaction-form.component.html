<ion-header class="ion-no-border">
  <ion-toolbar class="form-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()" aria-label="Cerrar formulario">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ transaccion ? 'Editar' : 'Nueva' }} Transacción</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <form [formGroup]="form">

    <!-- Tipo segmento -->
    <div class="form-section">
      <ion-segment formControlName="tipo" class="tipo-segment">
        <ion-segment-button *ngFor="let t of tipos" [value]="t.id">
          <ion-icon [name]="t.icono"></ion-icon>
          <ion-label>{{ t.nombre }}</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <!-- Campos -->
    <div class="form-fields">

      <ion-item class="mw-field" lines="inset">
        <ion-label position="floating">Categoría *</ion-label>
        <ion-select formControlName="categoria" interface="popover">
          <ion-select-option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item class="mw-field" lines="inset">
        <ion-label position="floating">Fecha *</ion-label>
        <ion-datetime formControlName="fecha" presentation="date"></ion-datetime>
      </ion-item>

      <ion-item class="mw-field" lines="inset">
        <ion-label position="floating">Monto *</ion-label>
        <ion-input type="number" formControlName="monto" placeholder="0"></ion-input>
      </ion-item>

      <ion-item class="mw-field" lines="inset">
        <ion-label position="floating">Descripción (opcional)</ion-label>
        <ion-textarea formControlName="descripcion" rows="3" auto-grow="true"></ion-textarea>
      </ion-item>

    </div>

    <!-- Comprobante -->
    <div class="comprobante-section">
      <p class="comprobante-label">
        <ion-icon name="image-outline"></ion-icon>
        Comprobante
      </p>
      <app-photo-selector
        [fotoActual]="fotoActual"
        (onFotoSeleccionada)="onFotoSeleccionada($event)"
        (onFotoEliminada)="onFotoEliminada()">
      </app-photo-selector>
    </div>

    <!-- Guardar -->
    <div class="form-save-section">
      <ion-button expand="block" class="save-btn" (click)="guardar()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        Guardar Transacción
      </ion-button>
    </div>

  </form>
</ion-content>
