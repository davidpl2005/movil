<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="irALogin()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Crear Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item [class.ion-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
      <ion-label position="floating">Nombre completo</ion-label>
      <ion-input type="text" formControlName="nombre" placeholder="Tu nombre"></ion-input>
      <ion-note slot="error">El nombre es requerido</ion-note>
    </ion-item>

    <ion-item [class.ion-invalid]="form.get('email')?.invalid && form.get('email')?.touched" style="margin-top: 12px;">
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" formControlName="email" placeholder="ejemplo@correo.com"></ion-input>
      <ion-note slot="error">Ingresa un email válido (ejemplo@correo.com)</ion-note>
    </ion-item>

    <div class="ion-padding-start ion-padding-top" *ngIf="form.get('email')?.touched && form.get('email')?.value">
      <ion-text [color]="form.get('email')?.value?.includes('@') ? 'success' : 'medium'" style="font-size: 13px; display: block;">
        <ion-icon [name]="form.get('email')?.value?.includes('@') ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
        Debe contener @
      </ion-text>
      <ion-text [color]="form.get('email')?.value?.includes('.') ? 'success' : 'medium'" style="font-size: 13px; display: block;">
        <ion-icon [name]="form.get('email')?.value?.includes('.') ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
        Debe contener un punto (.)
      </ion-text>
    </div>

    <ion-item [class.ion-invalid]="form.get('password')?.invalid && form.get('password')?.touched" style="margin-top: 12px;">
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" formControlName="password" placeholder="Mínimo 6 caracteres"></ion-input>
      <ion-note slot="error">Mínimo 6 caracteres</ion-note>
    </ion-item>

    <div class="ion-padding-start ion-padding-top" *ngIf="form.get('password')?.touched && form.get('password')?.value">
      <ion-text [color]="form.get('password')?.value?.length >= 6 ? 'success' : 'medium'" style="font-size: 13px; display: block;">
        <ion-icon [name]="form.get('password')?.value?.length >= 6 ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
        Mínimo 6 caracteres ({{ form.get('password')?.value?.length || 0 }}/6)
      </ion-text>
    </div>

    <div class="ion-padding-top">
      <ion-button expand="block" (click)="registrar()">
        <ion-icon slot="start" name="person-add"></ion-icon>
        Crear Cuenta
      </ion-button>
    </div>
  </form>
</ion-content>
