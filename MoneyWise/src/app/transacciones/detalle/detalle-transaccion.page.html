<ion-header class="ion-no-border">
  <ion-toolbar class="mw-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/transacciones" text="" aria-label="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="mw-page detail-content">
  <main class="mw-screen detail-screen">
    <app-transaction-detail *ngIf="transaccion" [transaccion]="transaccion" (onEdit)="editar()" (onDelete)="eliminar()" (onVerComprobante)="verComprobante()"></app-transaction-detail>

    <app-empty-state *ngIf="!transaccion" mensaje="No encontramos esta transacción. Puede haber sido eliminada." icono="alert-circle-outline"></app-empty-state>
  </main>
</ion-content>
