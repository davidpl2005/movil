<ion-app>
  <section class="mw-splash" *ngIf="showSplash" aria-label="Cargando MoneyWise">
    <div class="splash-orb orb-one"></div>
    <div class="splash-orb orb-two"></div>

    <div class="splash-card">
      <div class="splash-logo" aria-hidden="true">
        <svg viewBox="0 0 128 128" role="img">
          <defs>
            <linearGradient id="mwIconGradient" x1="18" x2="110" y1="12" y2="116" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#34d399" />
              <stop offset="0.55" stop-color="#0f766e" />
              <stop offset="1" stop-color="#0f172a" />
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="108" height="108" rx="30" fill="url(#mwIconGradient)" />
          <path d="M35 45h44c9 0 16 7 16 16v25c0 7-6 13-13 13H35c-8 0-15-7-15-15V60c0-8 7-15 15-15Z" fill="rgba(255,255,255,.95)" />
          <path d="M35 39h43c5 0 9 4 9 9H34c-4 0-7 3-7 7v1c-2-2-3-4-3-7 0-6 5-10 11-10Z" fill="rgba(255,255,255,.72)" />
          <circle cx="82" cy="72" r="8" fill="#0f766e" />
          <path d="M42 83c9-20 22-30 42-36" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
          <path d="M71 48h15v15" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="splash-kicker">MoneyWise</p>
      <h1>Organizando tus finanzas</h1>
      <div class="splash-progress"><span></span></div>
    </div>
  </section>

  <ion-router-outlet></ion-router-outlet>
</ion-app>
